name: Downstream validation
on:
  push:
    branches: ['main', 'feat/**', 'integration/**']
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Upstream has two pre-existing go-vet failures, documented below.
      - run: go test -vet=off ./...
      - run: go test -vet=off -race ./web/service
      - run: node web/assets/js/model/monthly-reset.test.cjs
      - run: node --test web/assets/js/model/monthly-help.test.cjs
      - run: node web/assets/js/util/traffic-identity.test.cjs
      - run: node --test web/assets/js/util/home-promotion.test.cjs
      - run: node --test web/assets/js/util/operator-promotion.test.cjs
      - run: go build -o "$RUNNER_TEMP/x-panel" .
